name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SEMGREP_SEND_METRICS: "off"
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out pinned community rules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: .security-rules
          persist-credentials: false
      - name: Test finding review safeguards
        run: python .github/scripts/test_security_scan.py
      - name: Scan PHP, JavaScript, TypeScript, and the optional snippet
        id: scan
        run: python .github/scripts/security_scan.py --rules-root .security-rules
      - name: Publish findings to GitHub Security
        if: ${{ always() && hashFiles('build/security/results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: build/security/results.sarif
          category: semgrep-php-javascript
